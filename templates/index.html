<!DOCTYPE html>
<html>
<head>

<title>Estação Meteorológica IoT</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">

</head>

<body>

<div class="card">

<h1>🌤 Estação Meteorológica IoT</h1>

<br>

<div class="painel-sensores">

    <div class="sensor-card">
        <div class="titulo">
            🌡 Temperatura
        </div>

        <div class="valor" id="temperaturaAtual">
            {{temperatura}} °C
        </div>
    </div>

    <div class="sensor-card">
        <div class="titulo">
            💧 Umidade
        </div>

        <div class="valor" id="umidadeAtual">
            {{umidade}} %
        </div>
    </div>

</div>

<br><br>

<p style="color:#22c55e;">
🟢 ESP32 Online
</p>

<hr>

<h3>📜 Últimas Leituras</h3>

<h3>📊 Monitoramento em Tempo Real</h3>

<canvas id="graficoTemperatura" height="120"></canvas>

<table style="width:100%; color:white;">

<tr>
<th>Temperatura</th>
<th>Umidade</th>
<th>Data/Hora</th>
</tr>

{{ historico|safe }}

</table>


</div>

<script>
const temperaturas = {{ dados_grafico }};
const umidades = {{ dados_umidade }};

</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="{{ url_for('static', filename='js/grafico.js') }}"></script> 


</body>

</html>
